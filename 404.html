<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ate10</title>
  <style>
    body { margin: 0; background: #f4f1ec; color: #1c1c1c; font: 16px/1.5 "Avenir Next", "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 72px 20px; }
    h1 { font-size: 40px; line-height: 1.1; font-weight: 700; margin: 0; }
    p { margin: 16px 0 0; color: #3f3f3f; max-width: 36em; }
    .open { display: inline-block; margin-top: 28px; padding: 12px 22px; border-radius: 999px; background: #1c1c1c; color: #fff; text-decoration: none; font-weight: 600; }
    nav { display: flex; gap: 16px; margin-top: 28px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Ate10</h1>
    <p id="line">This page isn't here.</p>
    <a id="open" class="open" href="/" hidden>Open in Ate10</a>
    <nav>
      <a href="/">Home</a>
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
    </nav>
  </main>
  <script>
    // Shared links (ate10.com/dish/…, /u/…, /picks/…) open the app directly on an iPhone with Ate10 installed.
    // Anyone who lands here instead (no app yet, or another device) gets a button that tries the app's own link.
    (function () {
      var m = location.pathname.match(/^\/(dish|d|u|picks)\/([^/?#]+)/);
      if (!m) return;
      var kind = m[1] === "d" ? "dish" : m[1];
      var what = { dish: "a dish", u: "a profile", picks: "a pick" }[kind];
      document.getElementById("line").textContent = "Someone shared " + what + " on Ate10. Open it in the app on your iPhone.";
      var open = document.getElementById("open");
      open.href = "social.ate://" + kind + "/" + m[2];
      open.hidden = false;
      document.title = "Ate10";
    })();
  </script>
</body>
</html>
